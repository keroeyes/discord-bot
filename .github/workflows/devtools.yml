name: Development worker checks
on:
  push:
    paths: ["devtools/**", ".github/workflows/devtools.yml"]
  pull_request:
    paths: ["devtools/**", ".github/workflows/devtools.yml"]
permissions:
  contents: read
jobs:
  worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      E2B_API_KEY: ""
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r devtools/requirements.txt
      - run: python -m unittest discover -s devtools -v

  serena:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      SERENA_HOME: ${{ runner.temp }}/serena-home
      UV_CACHE_DIR: ${{ runner.temp }}/serena-uv-cache
      UV_PYTHON_DOWNLOADS: "never"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Serena 1.7.0 runs its pinned Pyright server through uvx -p 3.13,
      # even when the Serena process itself is being checked on Python 3.11.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the optional Serena tools separately from the bot and worker
        run: python -m pip install -r devtools/requirements-serena.txt
      - name: Check installed dependencies and uv version
        run: |
          python -m pip check
          uv --version
      - name: Resolve Serena dependencies with the selected Python version
        run: uv pip compile --python-version "${{ matrix.python-version }}" devtools/requirements-serena.txt --output-file "${{ runner.temp }}/serena-requirements.txt"
      - name: Check the Serena CLI
        run: serena --help
      - name: Query project symbols and references through the local MCP server
        run: python devtools/serena_check.py --cache-home "${{ runner.temp }}/serena-check"
