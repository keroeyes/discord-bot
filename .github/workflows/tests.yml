name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      PYTHONPATH: ".:tests"
      BOT_LANGFUSE_ENABLED: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install quality tools
        run: python -m pip install -r requirements-evals.txt
      - name: Run offline DeepEval regressions
        run: python -m unittest discover -s evals -v
      - name: Run tracing and response contract tests with Langfuse installed
        run: python -m unittest discover -s tests -p test_observability.py -v

  answer-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Evaluate synthetic answer content offline (no dependencies or secrets)
        run: python -m unittest discover -s answer_evals -v

  ocr-preprocessing:
    # Keep the existing Ubuntu check name for branch protection rules.
    name: ${{ matrix.os == 'ubuntu-latest' && 'ocr-preprocessing' || 'ocr-preprocessing-windows' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install OCR preprocessing and rendering libraries (no GPU or model)
        # Constraints select the worker's pins without installing torch or the model.
        run: python -m pip install -c requirements-ocr.txt Pillow pymupdf matplotlib
      - name: Check preprocessing dependency consistency
        run: python -m pip check
      - name: Verify and report installed OCR dependency versions
        shell: python
        run: |
          from importlib.metadata import version
          from pathlib import Path
          import PIL.Image
          import pymupdf

          pins = dict(
              line.strip().split('==', 1)
              for line in Path('requirements-ocr.txt').read_text(encoding='utf-8').splitlines()
              if '==' in line and not line.lstrip().startswith('#')
          )
          for package in ('Pillow', 'pymupdf', 'matplotlib'):
              actual = version(package)
              expected = pins[package]
              print(f'{package}: installed={actual}, requirements-ocr.txt={expected}', flush=True)
              if actual != expected:
                  raise SystemExit(f'{package} version mismatch')
      - name: Smoke test Matplotlib image and text rendering offline
        shell: python
        run: |
          from io import BytesIO
          import matplotlib
          from PIL import Image

          matplotlib.use('Agg')
          import matplotlib.pyplot as plt

          # Use the bundled font and synthetic pixels; no GUI, font download or model.
          with matplotlib.rc_context({'font.family': 'DejaVu Sans', 'text.usetex': False}):
              figure, axes = plt.subplots(figsize=(3, 2), dpi=100)
              try:
                  axes.imshow([[0, 1], [1, 0]], interpolation='bilinear',
                              interpolation_stage='rgba')
                  axes.set_title('OCR smoke 0123')
                  with BytesIO() as buffer:
                      figure.savefig(buffer, format='png')
                      buffer.seek(0)
                      with Image.open(buffer) as image:
                          image.load()
                          if image.format != 'PNG' or image.size != (300, 200):
                              raise SystemExit('Unexpected Matplotlib PNG output')
                          low, high = image.convert('L').getextrema()
                          if low == high:
                              raise SystemExit('Matplotlib rendered a blank image')
              finally:
                  plt.close(figure)
          print(f'Matplotlib {matplotlib.__version__}: Agg image and text rendering passed')
      - name: Test synthetic image and PDF preprocessing
        # Fail if PDF preparation regresses to the deprecated fitz import.
        run: python -W error::FutureWarning -m unittest discover -s tests -p test_ocr_preprocessing.py -v
