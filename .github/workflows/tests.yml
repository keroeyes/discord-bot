name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      PYTHONPATH: ".:tests"
      BOT_LANGFUSE_ENABLED: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install quality tools
        run: python -m pip install -r requirements-evals.txt
      - name: Run offline DeepEval regressions
        run: python -m unittest discover -s evals -v
      - name: Run tracing and response contract tests with Langfuse installed
        run: python -m unittest discover -s tests -p test_observability.py -v

  answer-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Evaluate synthetic answer content offline (no dependencies or secrets)
        run: python -m unittest discover -s answer_evals -v

  ocr-preprocessing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install input preparation libraries only (no GPU or model)
        run: python -m pip install Pillow==12.1.1 pymupdf==1.27.2.2
      - name: Test synthetic image and PDF preprocessing
        run: python -m unittest discover -s tests -p test_ocr_preprocessing.py -v

  development-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install existing development dependencies
        run: python -m pip install -r devtools/requirements.txt
      - name: Run offline worker and acceptance regressions
        run: python -m unittest discover -s devtools -v
